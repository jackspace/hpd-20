[pytest]
# Pytest configuration for HPD-20 Editor

# Test discovery
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Output options
addopts =
    -v
    --strict-markers
    --tb=short
    --cov=hpd20
    --cov-report=html
    --cov-report=term-missing
    --cov-report=xml
    --cov-fail-under=80
    -ra

# Coverage options
[coverage:run]
source = hpd20
omit =
    */tests/*
    */test_*
    */__init__.py
    */ethnic_scales.py
    */instrumentname.py

[coverage:report]
precision = 2
show_missing = True
skip_covered = False

[coverage:html]
directory = htmlcov
